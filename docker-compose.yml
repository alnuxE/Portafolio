services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portafolio-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
